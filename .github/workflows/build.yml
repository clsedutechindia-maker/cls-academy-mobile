name: App build (EAS local)

# Builds the app on GitHub's runners using `eas build --local`. Local builds do
# NOT consume EAS cloud build quota, and the runner has enough RAM to avoid the
# OOM that kills builds on low-memory machines. Credentials are pulled from the
# EAS account via EXPO_TOKEN, so output is signed with the same keys as cloud
# builds (store-safe).
#
# Trigger manually: Actions tab -> "App build (EAS local)" -> Run workflow.
#   platform=android, profile=production -> .aab  (upload to Play Console)
#   platform=android, profile=preview    -> .apk  (sideload to a device)
#   platform=ios,     profile=production -> .ipa  (App Store / TestFlight)
#
# iOS PREREQUISITES (one-time, before an iOS run will succeed):
#   1. Apple Developer Program enrollment ($99/yr) complete.
#   2. iOS credentials registered in EAS: run `eas credentials` (platform iOS)
#      to create/upload the distribution cert + provisioning profile. They are
#      then pulled automatically here via EXPO_TOKEN.
#   3. Fill appleTeamId / ascAppId in eas.json submit.ios (only needed for submit).
# iOS runs on macOS (Xcode required); macOS runner minutes bill ~10x on GitHub.

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Target platform
        type: choice
        options:
          - android
          - ios
        default: android
      profile:
        description: EAS build profile
        type: choice
        options:
          - production
          - preview
        default: production

jobs:
  build:
    # iOS must build on macOS (Xcode); Android builds on Linux.
    runs-on: ${{ inputs.platform == 'ios' && 'macos-latest' || 'ubuntu-latest' }}
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up JDK 17
        if: inputs.platform == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        if: inputs.platform == 'android'
        uses: android-actions/setup-android@v3

      # Cache Gradle deps + wrapper across runs so native deps don't re-download
      # every build — biggest repeat-run speedup.
      - name: Cache Gradle
        if: inputs.platform == 'android'
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          PLATFORM="${{ inputs.platform }}"
          PROFILE="${{ inputs.profile }}"
          if [ "$PLATFORM" = "ios" ]; then
            EXT=ipa
          elif [ "$PROFILE" = "production" ]; then
            EXT=aab
          else
            EXT=apk
          fi
          OUT="$RUNNER_TEMP/cls-${PLATFORM}-${PROFILE}.${EXT}"
          # Android preview is for sideloading onto an arm64 test device, so build
          # only that ABI — ~3-4x faster native compile. Production builds all
          # ABIs for broad Play Store device support.
          if [ "$PLATFORM" = "android" ] && [ "$PROFILE" = "preview" ]; then
            export ORG_GRADLE_PROJECT_reactNativeArchitectures=arm64-v8a
          fi
          eas build --local --non-interactive \
            --platform "$PLATFORM" --profile "$PROFILE" \
            --output "$OUT"
          echo "ARTIFACT_PATH=$OUT" >> "$GITHUB_ENV"
          echo "ARTIFACT_NAME=cls-${PLATFORM}-${PROFILE}-${EXT}" >> "$GITHUB_ENV"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.ARTIFACT_PATH }}
          retention-days: 14
          if-no-files-found: error
